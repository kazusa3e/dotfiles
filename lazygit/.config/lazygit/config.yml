# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/v0.66.3/schema/config.json
promptToReturnFromSubprocess: false

git:
  diffRenderers:
    - command: >-
        delta --{{colorScheme}} --paging=never
        {{if eq .colorScheme "dark"}}--features=cc-diff{{end}}
