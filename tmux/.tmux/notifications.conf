# Requires tmux 3.8. Keep state on panes; hooks run serially on the server queue.
set -g window-status-bell-style default

set-hook -g 'pane-bell[notifications]' {
    if-shell -F '#{!:#{@bell_focused}}' {
        if-shell -F '#{!:#{@bell_order}}' {
            set-option -sF @bell_sequence '#{e|+|:#{?@bell_sequence,#{@bell_sequence},0},1}'
            set-option -pF @bell_order '#{@bell_sequence}'
            run-shell 'bash ~/.tmux/tmux-notify refresh'
        }
    }
}
set-hook -g 'pane-focus-in[notifications]' {
    set-option -p @bell_focused 1
    set-option -pu @bell_order
    run-shell 'bash ~/.tmux/tmux-notify refresh'
}
set-hook -g 'pane-focus-out[notifications]' {
    set-option -p @bell_focused 0
}
set-hook -g 'pane-exited[notifications]' 'run-shell "bash ~/.tmux/tmux-notify refresh"'
# Some topology changes (notably move-window -r) have no hook. Check in tmux,
# starting a helper only when the cached locations differ. The clock also handles
# changes before a monitor has taken its first sample.
set-option -s @bell_locations_format '#{S:#{W:#{P:#{?@bell_order,#{pane_id}=#{session_name}:#{window_index}.#{pane_index};,}}}}'
set-option -s @bell_clock '%H:%M:%S'
set-hook -g -T -B '@bell_locations::#{?#{!=:#{E:@bell_locations_format},#{@bell_locations}},#{T:@bell_clock},}' \
    'run-shell "bash ~/.tmux/tmux-notify refresh"'

bind-key a run-shell 'bash ~/.tmux/tmux-notify jump #{q:client_name}'
run-shell 'bash ~/.tmux/tmux-notify init'
