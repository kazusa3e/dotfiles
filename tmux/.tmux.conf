# == Ext ==
set -g base-index 1                         # start window numbering at 1
set -g renumber-windows on                  # renumber windows after any close
set -g allow-rename off                     # prevent programs from renaming windows
set -g automatic-rename off                 # auto-rename windows based on active program
set -g mode-keys vi                         # use vi keys in copy/choice modes
set -g repeat-time 200                      # key repeat timeout in ms (200)
set -g escape-time 10                       # reduce escape key delay to 10ms
set -g set-titles on                        # update terminal title
set -g set-titles-string "#S - #W - #T"     # title format: session - window - pane
set -g focus-events on                      # forward focus events to applications
set -g mouse on                             # enable mouse support
set -g allow-passthrough on                 # allow escape sequences to pass through
set -g extended-keys on                     # enable extended keys
set -g extended-keys-format csi-u           # enable extended keys format

# == Copy ==
set -g set-clipboard on                     # integrate with system clipboard
# v to start visual selection
bind -T copy-mode-vi v send -X begin-selection
# y to copy selection to system clipboard
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# == Styles ==
# colors
set -g default-terminal "tmux-256color"             # set default terminal type
set -sa terminal-overrides ',xterm*:sitm=\E[3m'     # enable italic support in xterm
set -sa terminal-features ",xterm-*:RGB:usstyle"    # enable RGB and styled underlines
set -sa terminal-features ",alacritty*:RGB"
set -sa terminal-features ",wezterm*:RGB:usstyle"  # enable RGB and styled underlines
set -ga terminal-overrides ",*256col*:Tc"

# status bar
set -g status on                            # enable status bar
set -g status-interval 10                   # refresh status every 10 seconds
set -g status-position top                  # place status bar at top

# == Hotkeys ==
# prefix
unbind C-b                                  # unbind default prefix
unbind C-x                                  # unbind C-x to avoid conflict
set-option -g prefix C-x                    # set prefix to C-x
bind-key C-x send-prefix                    # press C-x twice to send literal C-x
bind-key p set status                       # p toggles status bar visibility

# split panes
unbind '"'                                  # unbind default horizontal split
unbind %                                    # unbind default vertical split
bind | split-window -h                      # | split horizontally (left/right)
bind \\ split-window -v                     # \ split vertically (top/bottom)

# move panes
bind -r h select-pane -L                    # h move to left pane
bind -r l select-pane -R                    # l move to right pane
bind -r j select-pane -D                    # j move to bottom pane
bind -r k select-pane -U                    # k move to top pane

# resize panes
bind -r H resize-pane -L 5                  # H expand pane left by 5
bind -r L resize-pane -R 5                  # L expand pane right by 5
bind -r J resize-pane -D 5                  # J expand pane down by 5
bind -r K resize-pane -U 5                  # K expand pane up by 5

# move windows
bind -r Space last-window                   # Space switch to last active window
bind -r o switch-client -l                  # o switch to last active session

# rename window
unbind ,                                    # unbind default rename binding
unbind r                                    # unbind default r binding
# r sets a stable name for the current tab
bind-key r command-prompt -I "#W" "rename-window '%%'"

# reload configuration
bind R source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# == Theme ==
# Native status line: fixed-width metric fields keep the right edge steady.
set -g status-style 'fg=#cdd6f4'
set -g status-left-length 42
set -g status-right-length 70
set -g status-left '#[fg=#f5e0dc,bold]  #{=/34/⋯:session_path} #[default]'
set -g status-right '#(bash ~/.tmux/tmux-status) #[fg=#6c7086] │ #[fg=#94e2d5,bold]󰥔  #[nobold]%-I:%M#[default]'
set -g window-status-format '#[fg=#6c7086]  #I:#W '
set -g window-status-current-format '#[fg=#cba6f7,bold] #I:#W #[default]'
## Pane visibility
set -g pane-border-status off
# set -g pane-border-format "#{?pane_active,#[bold] ACTIVE #[nobold],}#P · #{pane_title}"
# set -g pane-active-border-style 'fg=#f5c2e7'
set -g pane-border-style 'fg=#45475a'


run ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run ~/.tmux/plugins/tmux-continuum/continuum.tmux

set -g @resurrect-processes 'ssh vim nvim'
